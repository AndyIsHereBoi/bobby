name: Build and Release

# Pushes to the backport branch just build the mod and upload the jar as an artifact.
# A version tag (v*) or a manual run additionally publishes a GitHub release.
# There is intentionally no version bumping here: build.gradle.kts reads the version from
# gradle.properties and CHANGELOG.md must start with "### <version>", so bump those in a
# commit first, then tag that commit.

on:
  push:
    branches:
      - mc-1.18.2
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      mod-version: ${{ steps.version.outputs.mod_version }}
      tag: ${{ steps.version.outputs.tag }}
      jar: ${{ steps.version.outputs.jar }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version from gradle.properties
        id: version
        run: |
          set -euo pipefail
          mod_version=$(sed -n 's/^[[:space:]]*modVersion[[:space:]]*=[[:space:]]*//p' gradle.properties | tr -d ' \r' | head -n1)
          mc_version=$(sed -n 's/^[[:space:]]*minecraftVersion[[:space:]]*=[[:space:]]*//p' gradle.properties | tr -d ' \r' | head -n1)
          if [ -z "$mod_version" ] || [ -z "$mc_version" ]; then
            echo "::error::Could not read modVersion / minecraftVersion from gradle.properties"
            exit 1
          fi
          version="$mod_version+mc$mc_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "jar=bobby-$version.jar" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          expected='${{ steps.version.outputs.tag }}'
          actual="$GITHUB_REF_NAME"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Tag '$actual' does not match gradle.properties version '$expected'."
            exit 1
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Verify the jar
        run: |
          set -euo pipefail
          jar="build/libs/${{ steps.version.outputs.jar }}"
          if [ ! -f "$jar" ]; then
            echo "::error::Expected $jar was not produced"
            ls -l build/libs || true
            exit 1
          fi
          python3 - "$jar" "${{ steps.version.outputs.version }}" <<'PY'
          import json
          import sys
          import zipfile

          path, expected = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(path) as archive:
              meta = json.loads(archive.read("fabric.mod.json"))

          if meta.get("id") != "bobby":
              sys.exit(f"{path} is not the bobby mod (id={meta.get('id')})")
          if meta.get("version") != expected:
              sys.exit(f"{path} declares version {meta.get('version')}, expected {expected}")
          print(f"OK: {path} is bobby {meta['version']}")
          PY
          ls -l "$jar"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: bobby-${{ steps.version.outputs.version }}
          path: build/libs/${{ steps.version.outputs.jar }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: bobby-${{ needs.build.outputs.version }}
          path: dist

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          expected='### ${{ needs.build.outputs.mod-version }}'
          tr -d '\r' < CHANGELOG.md | awk '/^### / { section++ } section == 1' > release-notes.md
          first=$(head -n1 release-notes.md)
          # Mirrors readChangelog() in build.gradle.kts, which requires CHANGELOG.md to start with
          # "### <modVersion>" (the mod version, not the full version with the MC part).
          if [ "$first" != "$expected" ]; then
            echo "::error::CHANGELOG.md starts with '$first', expected '$expected'"
            exit 1
          fi
          echo "--- release notes ---"
          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Bobby ${{ needs.build.outputs.version }}
          body_path: release-notes.md
          files: dist/${{ needs.build.outputs.jar }}
          fail_on_unmatched_files: true
